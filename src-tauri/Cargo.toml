[package]
name = "screen-partner"
version = "0.0.1"
description = "A lightweight system-aware desktop pet"
authors = ["shmilyfuu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "screen_partner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
